<text x="299.5" y="463" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">0</text>
<rect x="346" y="442" width="93" height="30" rx="0" fill="white" stroke="#d5dee7"/>
<text x="392.5" y="463" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">1</text>
<text x="392.5" y="402" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="bold">C</text>
<text x="113.5" y="492" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="bold">C</text>
<rect x="160" y="472" width="93" height="30" rx="0" fill="#e9f3fc" stroke="#d5dee7"/>
<text x="206.5" y="493" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">2</text>
<rect x="253" y="472" width="93" height="30" rx="0" fill="white" stroke="#d5dee7"/>
<text x="299.5" y="493" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">1</text>
