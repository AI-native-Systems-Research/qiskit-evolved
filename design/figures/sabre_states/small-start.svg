<text x="113.5" y="462" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="bold">B</text>
<rect x="160" y="442" width="93" height="30" rx="0" fill="#fff3d8" stroke="#d5dee7"/>
<text x="206.5" y="463" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">1</text>
