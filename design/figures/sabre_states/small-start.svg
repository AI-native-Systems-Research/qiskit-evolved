<text x="392.5" y="493" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="middle" font-weight="normal">0</text>
<text x="24" y="550" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">Edge labels give current locations, even beside completed gates. They are not hardware links.</text>
<text x="24" y="576" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">A SWAP changes the matrix; emitting a gate leaves the layout and matrix unchanged.</text>
