<text x="98.0" y="92" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#165f98" text-anchor="start" font-weight="bold">R1: pair (q0, q1)</text>
<text x="578.0" y="92" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#875400" text-anchor="start" font-weight="bold">R2: pair (q1, q2)</text>
<path d="M558.0,214 L578.0,214" fill="none" stroke="#687e91" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="568.0" y="200" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#526477" text-anchor="middle" font-weight="normal">waits for</text>
<text x="24" y="395" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#165f98" text-anchor="start" font-weight="bold">R1.block = min(3, 1 + 0 + 1 + 0) = 2</text>
<text x="560" y="395" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#875400" text-anchor="start" font-weight="bold">R2.block = 1</text>
<text x="24" y="430" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">CX, CY, CZ, ECR count 1; any other two-qubit gate counts 3; one-qubit gates count 0; the sum is capped at 3.</text>
<text x="24" y="454" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">A measurement, reset, barrier or control-flow operation inside a node sets block = None: that node ends any run.</text>
</svg>
