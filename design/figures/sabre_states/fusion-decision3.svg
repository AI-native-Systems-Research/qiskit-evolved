<text x="24" y="660" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">Without the credit SWAP(p4, p5) wins by 1/12. The credit of -2/3 is eight times larger and moves SWAP(p3, p4) to the front.</text>
<text x="24" y="684" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">A credit never beats a full distance step: a SWAP that pushes a front pair apart still scores +1/3 at best.</text>
