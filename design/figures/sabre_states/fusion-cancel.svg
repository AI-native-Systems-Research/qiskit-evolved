<text x="133.0" y="272" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="middle" font-weight="normal">g6</text>
<text x="223.0" y="272" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="middle" font-weight="normal">SWAP</text>
<text x="24" y="330" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182c42" text-anchor="start" font-weight="bold">2.  The SWAP written as three CX</text>
<text x="560" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526477" text-anchor="start" font-weight="bold">still 4 CX</text>
<text x="76" y="402" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="end" font-weight="bold">p3</text>
