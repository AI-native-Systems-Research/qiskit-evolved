<text x="293.0" y="672" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="start" font-weight="normal">Same effect on p3 and p4 as g6 followed by the SWAP.</text>
<text x="293.0" y="698" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="start" font-weight="normal">There is no separate SWAP left to run.</text>
<text x="24" y="764" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526477" text-anchor="start" font-weight="normal">Saving: 2 CX. One SWAP is 3 CX, so in the score&#x27;s units (SWAPs) the credit is -2/3.</text>
</svg>
