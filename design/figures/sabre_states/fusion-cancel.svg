<text x="133.0" y="523" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="middle" font-weight="normal">g6</text>
<text x="313.0" y="523" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526477" text-anchor="middle" font-weight="normal">the SWAP, as three CX</text>
<text x="473.0" y="391" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#176850" text-anchor="start" font-weight="bold">The boxed CX gates are identical and adjacent.</text>
<text x="473.0" y="417" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#176850" text-anchor="start" font-weight="normal">A CX undoes itself, so together they do nothing</text>
<text x="473.0" y="443" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#176850" text-anchor="start" font-weight="normal">and can be removed.</text>
<text x="24" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182c42" text-anchor="start" font-weight="bold">3.  After removing the pair</text>
<text x="560" y="580" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#176850" text-anchor="start" font-weight="bold">2 CX</text>
<text x="76" y="647" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="end" font-weight="bold">p3</text>
