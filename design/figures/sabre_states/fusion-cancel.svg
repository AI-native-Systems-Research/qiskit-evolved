<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img"><title>Why a SWAP right after a CX is cheaper: the two meeting CX gates cancel</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#687e91"/></marker></defs>
<rect width="1000" height="800" fill="white"/>
<text x="24" y="35" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#182c42" text-anchor="start" font-weight="bold">Why a SWAP right after a CX is cheaper</text>
<text x="24" y="67" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182c42" text-anchor="start" font-weight="normal">Decision 3 of the running route: g6 = CX(p3, p4) was just emitted, and SWAP(p3, p4) is a candidate.</text>
<text x="24" y="118" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182c42" text-anchor="start" font-weight="bold">1.  What the router would place</text>
<text x="560" y="118" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526477" text-anchor="start" font-weight="bold">cost: 1 + 3 = 4 CX</text>
<text x="76" y="172" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182c42" text-anchor="end" font-weight="bold">p3</text>
