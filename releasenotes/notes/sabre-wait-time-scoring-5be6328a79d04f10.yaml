features_transpiler:
  - |
    Added an opt-in "wait time" component to the SABRE routing heuristic.  When enabled, each
    physical qubit tracks the estimated two-qubit layer at which it next becomes free, and each
    candidate SWAP is charged a small score per layer it would wait for its qubits, so SWAPs on
    idle wires are preferred among otherwise equal choices.  Each two-qubit interaction routed by
    SABRE occupies one layer (consecutive gates on the same pair of qubits are routed as a single
    interaction, so they count once) and an inserted SWAP occupies three.  Select it in
    :class:`.SabreSwap` with the new ``heuristic="wait_time"`` string, which is the ``"decay"``
    preset plus this term, or add it to a custom ``qiskit._accelerate.sabre.Heuristic`` with
    ``with_wait_time(weight)``::

        from qiskit.transpiler import CouplingMap
        from qiskit.transpiler.passes import SabreSwap

        routing = SabreSwap(CouplingMap.from_line(5), heuristic="wait_time", seed=0)

    The component is disabled by default; the existing heuristics, :class:`.SabreLayout` and
    the preset pass managers are unchanged.
